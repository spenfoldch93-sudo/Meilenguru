[[redirects]]
  from = "https://meilenguru.netlify.app/*"
  to = "https://meilenguru.ch/:splat"
  status = 301
  force = true

# Netlify's automatic .html -> clean-URL redirect stopped covering pages
# added after the site grew past ~90 pages (likely an auto-generated
# redirect-rule cap). These 14 pages were serving duplicate content at
# both the .html URL and the clean URL with no redirect between them.
# Explicit rules here are reliable regardless of that cap.
[[redirects]]
  from = "/amex-gold-schweiz-test.html"
  to = "/amex-gold-schweiz-test"
  status = 301
  force = true
